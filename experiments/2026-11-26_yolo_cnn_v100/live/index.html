<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마커 후보 · 수동 주행 시뮬</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--panel:#131e28;--line:#273746;--muted:#a7b4c1;--text:#eef4fa;--cnn:#51e0c1;--yolo:#ffbf67}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:1260px;margin:auto;padding:22px clamp(16px,4vw,36px)}header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
h1,h2,p{margin:0}h1{font-size:clamp(20px,3vw,28px);letter-spacing:-.04em}h2{font-size:16px}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(315px,1fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px}
.status{border:1px solid var(--line);border-radius:30px;padding:5px 11px;white-space:nowrap;color:var(--muted);font-size:13px}
.status.ready{color:var(--cnn);border-color:#277761}.status.stale{color:var(--yolo)}
.camera{height:clamp(275px,58vh,620px);background:#05080d;display:grid;place-items:center;position:relative}
canvas{display:block;width:100%;height:100%;object-fit:contain}canvas[hidden]{display:none}
#empty{padding:24px;color:var(--muted);text-align:center}small,.sub{color:var(--muted);font-size:13px}
.sub,.numbers,output,.score{font-variant-numeric:tabular-nums}.models{display:grid;gap:12px}
.model{color:var(--model);padding:12px 14px 14px}.model.cnn{--model:var(--cnn)}.model.yolo{--model:var(--yolo)}
.model .bar{padding:0 0 9px}.model label{color:var(--text);display:flex;gap:7px;align-items:center}
.model input{accent-color:var(--model)}.scores{list-style:none;margin:0;padding:0;display:grid;gap:4px;min-height:98px}
.scores li{display:grid;grid-template-columns:33px minmax(50px,1fr) 58px;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.scores li b{text-align:right;color:var(--model);font-size:14px}.scores li i{height:5px;background:#273746;border-radius:5px;overflow:hidden}
.scores li em{display:block;height:100%;background:var(--model)}.scores li.none{display:block}
.controls{padding:13px 14px;display:grid;gap:12px}.controls .bar{padding:0}.deck{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:repeat(3,minmax(44px,58px));gap:5px;flex-shrink:0}
button{background:#223241;color:var(--text);border:1px solid #3a5266;border-radius:8px;cursor:pointer;font:600 16px system-ui;min-height:39px;touch-action:none;user-select:none}
button.active{background:#2c6c65;border-color:var(--cnn)}button.stop{color:#ffdddd;border-color:#95545a}button:hover{border-color:#a7b4c1}
button:focus-visible,input:focus-visible{outline:2px solid var(--cnn);outline-offset:2px}
.speed{display:grid;gap:3px;flex:1;min-width:130px}.speed input{width:100%;accent-color:var(--cnn)}
.foot{border-top:1px solid var(--line);min-height:44px}.aside{display:grid;gap:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.models{grid-template-columns:1fr 1fr}.camera{height:min(61vw,500px)}}
@media(max-width:470px){
  main{padding:12px}.layout{grid-template-columns:minmax(0,1.25fr) minmax(106px,1fr);gap:8px}
  header{flex-wrap:wrap}.aside{display:contents}.controls{grid-column:1/-1;grid-row:2}
  .models{grid-template-columns:1fr;gap:7px}.model{padding:7px}.model .bar{flex-wrap:wrap;gap:0;padding-bottom:3px}
  .model small,.scores li{font-size:10px}.scores li{grid-template-columns:17px 1fr 35px;gap:4px}
  .scores li b{font-size:11px}.scores{min-height:76px;gap:2px}.camera{height:225px}
  .layout>section>.bar{flex-wrap:wrap;gap:2px;padding:7px}.aside>small{grid-column:1/-1}
}
</style>
<main>
  <header><h1>마커 후보 · 수동 주행 시뮬</h1><div class="status" id="status" role="status">Gazebo 연결 중</div></header>
  <div class="layout">
    <section class="panel" aria-label="시뮬 카메라">
      <div class="bar"><h2>전방 카메라</h2><span id="frame-id" class="sub">프레임 대기 중</span></div>
      <div class="camera"><div id="empty">두 모델의 추론 결과를 기다리는 중</div><canvas id="camera" hidden aria-label="모델 후보가 표시된 전방 영상"></canvas></div>
      <div class="bar foot"><span id="pose" class="sub">시뮬 구동 대기 중</span><span id="processing" class="sub"></span></div>
    </section>
    <aside class="aside">
      <section class="panel controls" aria-label="수동 조작">
        <div class="bar"><h2>수동 조작</h2><small>누르고 있는 동안 이동</small></div>
        <div class="deck">
          <div class="keys">
            <span></span><button data-dir="forward" aria-label="전진">↑</button><span></span>
            <button data-dir="left" aria-label="좌회전">←</button><button class="stop" id="stop" aria-label="정지">■</button><button data-dir="right" aria-label="우회전">→</button>
            <span></span><button data-dir="back" aria-label="후진">↓</button><span></span>
          </div>
          <label class="speed">이동 속도 <output id="speed-text">0.16 m/s</output><input id="speed" type="range" min=".06" max=".24" value=".16" step=".01"></label>
        </div>
        <small>방향키 또는 W A S D · Space 정지</small>
      </section>
      <div class="models">
        <section class="panel model cnn"><div class="bar"><label><input id="cnn-overlay" type="checkbox" checked><strong>CNN 증강형</strong></label><small id="cnn-time"></small></div><ol class="scores" id="cnn-scores"><li class="none">프레임 대기 중</li></ol></section>
        <section class="panel model yolo"><div class="bar"><label><input id="yolo-overlay" type="checkbox" checked><strong>YOLO11n 증강형</strong></label><small id="yolo-time"></small></div><ol class="scores" id="yolo-scores"><li class="none">프레임 대기 중</li></ol></section>
      </div>
      <small>각 모델의 상위 5개 후보 점수 · 두 점수의 척도는 서로 다름</small>
    </aside>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const colors = {cnn:'#51e0c1',yolo:'#ffbf67'};
const keys = {w:'forward',a:'left',s:'back',d:'right',ArrowUp:'forward',ArrowLeft:'left',ArrowDown:'back',ArrowRight:'right'};
const directions = new Map();
const canvas = $('camera'), ctx = canvas.getContext('2d');
let current = null, frameImage = null, scoreAge = Infinity, connected = false;
let busy = false, lastWasActive = false, controlError = false;

function draw() {
  if (!current || !frameImage) return;
  canvas.width = current.width; canvas.height = current.height;
  ctx.drawImage(frameImage, 0, 0);
  for (const kind of ['cnn','yolo']) {
    if (!$(kind+'-overlay').checked) continue;
    current[kind].forEach((hit,index) => {
      const [x,y,w,h] = hit.box;
      ctx.lineWidth = index ? 1 : 1.8;
      ctx.strokeStyle = colors[kind];
      ctx.setLineDash(kind === 'yolo' ? [5,2] : []);
      ctx.strokeRect(x,y,w,h);
      ctx.font = 'bold 9px system-ui';
      ctx.fillStyle = '#05080d';
      ctx.fillRect(x,Math.max(0,y-12),20,11);
      ctx.fillStyle = colors[kind];
      ctx.fillText((kind === 'cnn' ? 'C' : 'Y')+(index+1),x+2,Math.max(8,y-3));
    });
  }
}
function paint(frame, img) {
  current = frame; frameImage = img;
  $('frame-id').textContent = '프레임 '+frame.sequence+' · 시뮬 '+frame.sim_time.toFixed(2)+'초';
  $('processing').textContent = frame.width+'×'+frame.height;
  for (const kind of ['cnn','yolo']) {
    $(kind+'-time').textContent = Math.round(frame[kind+'_ms'])+' ms';
    const rows = frame[kind].map((hit,index) => {
      const item = document.createElement('li');
      const tag = document.createElement('span'), meter = document.createElement('i');
      const bar = document.createElement('em'), score = document.createElement('b');
      tag.textContent = (kind === 'cnn' ? 'C' : 'Y')+(index+1);
      bar.style.width = (100*Math.max(0,Math.min(1,hit.score))).toFixed(2)+'%';
      meter.append(bar);score.textContent = hit.score.toFixed(3);
      item.append(tag,meter,score);return item;
    });
    if (!rows.length) {
      const item = document.createElement('li');item.className = 'none';
      item.textContent = '이 프레임의 후보 없음';rows.push(item);
    }
    $(kind+'-scores').replaceChildren(...rows);
  }
  $('empty').hidden = true;canvas.hidden = false;draw();
}
async function frames() {
  try {
    const result = await (await fetch('/api/frame')).json();
    scoreAge = result.age ?? Infinity;
    if (result.frame && result.frame.sequence !== current?.sequence) {
      const image = new Image();
      image.src = 'data:image/jpeg;base64,'+result.frame.jpeg;
      await image.decode();
      paint(result.frame,image);
    }
    if (!current && result.error) $('empty').textContent = '시뮬 카메라 연결 대기 중';
  } catch {scoreAge = Infinity}
  finally {setTimeout(frames, 120)}
}
async function state() {
  try {
    const response = await fetch('/api/state');
    const result = await response.json();
    connected = response.ok && result.camera > 0 && !!result.odom;
    if (result.odom) {
      $('pose').textContent = '수동 조작 가능';
    }
  } catch {connected = false}
  finally {
    const label = $('status');
    const ready = connected && scoreAge < 2;
    label.textContent = !connected ? 'Gazebo 연결 중' : controlError ? '조작 신호 확인 중' : ready ? '시뮬 연결됨' : '추론 프레임 대기';
    label.className = 'status '+(ready ? 'ready' : 'stale');
    setTimeout(state,350);
  }
}
function command() {
  const held = new Set(directions.values()), speed = +$('speed').value;
  const bit = name => Number(held.has(name));
  return {linear: speed*(bit('forward')-bit('back')),angular: .7*(bit('left')-bit('right'))};
}
function repaintKeys(){
  const held = new Set(directions.values());
  for (const button of document.querySelectorAll('[data-dir]')) button.classList.toggle('active',held.has(button.dataset.dir));
}
async function sendCommand(){
  if (busy) return;
  const data = command(), active = !!(data.linear || data.angular);
  if (!active && !lastWasActive) return;
  busy = true;
  try {
    const result = await fetch('/api/drive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    controlError = !result.ok;
    lastWasActive = active || !result.ok;
  } catch {controlError = true;lastWasActive = true}
  finally {busy = false}
}
function stop(){
  directions.clear();lastWasActive = true;repaintKeys();sendCommand();
}
window.addEventListener('keydown',e=>{
  if (e.target instanceof HTMLInputElement) return;
  if (e.code === 'Space') {e.preventDefault();stop();return}
  const direction = keys[e.key] || keys[e.key.toLowerCase()];
  if (direction) {e.preventDefault();directions.set(e.code,direction);repaintKeys();sendCommand()}
});
window.addEventListener('keyup',e=>{
  if (directions.delete(e.code)) {e.preventDefault();repaintKeys();sendCommand()}
});
for (const button of document.querySelectorAll('[data-dir]')){
  button.addEventListener('pointerdown',e=>{
    e.preventDefault();button.setPointerCapture(e.pointerId);directions.set(e.pointerId,button.dataset.dir);repaintKeys();sendCommand();
  });
  for (const type of ['pointerup','pointercancel','lostpointercapture']){
    button.addEventListener(type,e=>{directions.delete(e.pointerId);repaintKeys();sendCommand()});
  }
}
$('stop').addEventListener('click',stop);
$('speed').addEventListener('input',()=>{$('speed-text').textContent=(+$('speed').value).toFixed(2)+' m/s'});
for (const kind of ['cnn','yolo']) $(kind+'-overlay').addEventListener('change',draw);
window.addEventListener('blur',stop);
document.addEventListener('visibilitychange',()=>{if (document.hidden) stop()});
window.addEventListener('pagehide',()=>navigator.sendBeacon('/api/drive',new Blob(['{"linear":0,"angular":0}'],{type:'application/json'})));
setInterval(sendCommand,85);frames();state();
</script>
</html>
