behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: true
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 0.85
    min_rotational_vel: 0.15
    robot_base_frame: base_link
    rotational_acc_lim: 1.8
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.1
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    action_server_result_timeout: 900.0
    bt_loop_duration: 10
    default_server_timeout: 1000
    enable_stamped_cmd_vel: true
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: odom
    robot_base_frame: base_link
    wait_for_service_timeout: 1000
collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: local_costmap/published_footprint
      min_points: 6
      simulation_time_step: 0.1
      time_before_collision: 1.2
      type: polygon
      visualize: false
    base_frame_id: base_link
    base_shift_correction: true
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    enable_stamped_cmd_vel: true
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - FootprintApproach
    scan:
      enabled: true
      max_height: 2.0
      min_height: 0.15
      topic: scan
      type: scan
    source_timeout: 1.0
    state_topic: collision_monitor_state
    stop_pub_timeout: 2.0
    transform_tolerance: 0.2
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.6
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      curvature_lookahead_dist: 0.6
      desired_linear_vel: 0.3
      inflation_cost_scaling_factor: 4.0
      interpolate_curvature_after_goal: false
      lookahead_dist: 0.45
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.2
      max_angular_accel: 1.8
      max_lookahead_dist: 0.6
      max_robot_pose_search_dist: 1.5
      min_approach_linear_velocity: 0.05
      min_lookahead_dist: 0.3
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.12
      rotate_to_heading_angular_vel: 0.75
      rotate_to_heading_min_angle: 0.785
      stateful: true
      transform_tolerance: 0.1
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: true
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    progress_checker:
      movement_time_allowance: 12.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
    progress_checker_plugins:
    - progress_checker
    use_realtime_priority: false
docking_server:
  ros__parameters:
    base_frame: base_link
    controller:
      k_delta: 2.0
      k_phi: 3.0
      v_linear_max: 0.15
      v_linear_min: 0.15
    controller_frequency: 50.0
    dock_approach_timeout: 30.0
    dock_backwards: false
    dock_plugins:
    - simple_charging_dock
    dock_prestaging_tolerance: 0.5
    enable_stamped_cmd_vel: true
    fixed_frame: odom
    initial_perception_timeout: 5.0
    max_retries: 3
    simple_charging_dock:
      docking_threshold: 0.05
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_roll: -1.57
      external_detection_rotation_yaw: 0.0
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      filter_coef: 0.1
      plugin: opennav_docking::SimpleChargingDock
      staging_x_offset: -0.7
      use_battery_status: false
      use_external_detection_pose: true
      use_stall_detection: false
    undock_angular_tolerance: 0.1
    undock_linear_tolerance: 0.05
    wait_charge_timeout: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      enable_stamped_cmd_vel: true
      footprint: '[[ 0.189,  0.000], [ 0.134, -0.134], [ 0.000, -0.189], [-0.134,
        -0.134], [-0.189,  0.000], [-0.134,  0.134], [ 0.000,  0.189], [ 0.134,  0.134]]'
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        known_dock:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          topic: mission/known_obstacles
        observation_sources: scan known_dock
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.06
      robot_base_frame: base_link
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      enable_stamped_cmd_vel: true
      footprint: '[[ 0.189,  0.000], [ 0.134, -0.134], [ 0.000, -0.189], [-0.134,
        -0.134], [-0.189,  0.000], [-0.134,  0.134], [ 0.000,  0.189], [ 0.134,  0.134]]'
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - voxel_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.06
      robot_base_frame: base_link
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      voxel_layer:
        enabled: true
        known_dock:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
          topic: mission/known_obstacles
        mark_threshold: 0
        max_obstacle_height: 2.0
        observation_sources: scan known_dock
        origin_z: 0.0
        plugin: nav2_costmap_2d::VoxelLayer
        publish_voxel_map: true
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: scan
        z_resolution: 0.05
        z_voxels: 16
      width: 3
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
    enable_stamped_cmd_vel: true
    planner_plugins:
    - GridBased
smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: true
    feedback: OPEN_LOOP
    max_accel:
    - 2.5
    - 0.0
    - 3.2
    max_decel:
    - -2.5
    - 0.0
    - -3.2
    max_velocity:
    - 0.3
    - 0.0
    - 0.75
    min_velocity:
    - -0.3
    - 0.0
    - -0.75
    odom_duration: 0.1
    odom_topic: odom
    scale_velocities: false
    smoothing_frequency: 20.0
    velocity_timeout: 1.0
waypoint_follower:
  ros__parameters:
    action_server_result_timeout: 900.0
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint
